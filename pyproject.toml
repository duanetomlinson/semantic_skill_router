[project]
name = "redis-skill-router"
version = "0.1.0"
description = "Zero-agent semantic command dispatch using Redis Vector Search"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Duane Tomlinson" },
]

dependencies = [
    "redis>=5.0.0",
    "sentence-transformers>=4.1.0",
    "numpy",
    "optimum[onnxruntime]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
